<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kronos">
  <style>
    /* An SVG favicon can carry its own dark-mode variant: browsers that
       support it re-evaluate this media query when the OS theme changes. */
    .bg { fill: #369369; }
    .fg { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #4fc08d; }
      .fg { stroke: #06120d; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <g class="fg" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="18"/>
    <path d="M32 20v12l8 5"/>
  </g>
</svg>
