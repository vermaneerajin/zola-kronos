name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the pinned Zola release into a user-writable directory, so the
      # step needs no sudo.
      - name: Install Zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Zola version
        run: zola --version

      # Requires Settings -> Pages -> Source = "GitHub Actions". The action's
      # `enablement` option cannot create the site itself: GITHUB_TOKEN has no
      # admin rights, so it fails with "Resource not accessible by integration".
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # `--base-url` overrides config.toml, so the demo works at whatever
      # path Pages serves it from (user site or /<repo>/ project site).
      - name: Build
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Check internal links
        run: zola check || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
